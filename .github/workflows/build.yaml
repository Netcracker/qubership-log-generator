name: Build Artifacts
on:
  release:
    types: [created]
  push:
    branches:
    - '**'
    paths-ignore:
    - '.github/**'
    - 'docs/**'
    - 'CODE-OF-CONDUCT.md'
    - 'CONTRIBUTING.md'
    - 'LICENSE'
    - 'README.md'
    - 'SECURITY.md'
  pull_request:
    branches:
    - '**'

permissions: {}

concurrency:
  # On main/release, we don't want any jobs cancelled so the sha is used to name the group
  # On PR branches, we cancel the job if new commits are pushed
  # More info: https://stackoverflow.com/a/68422069/253468
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-main-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      maven: ${{ steps.filter.outputs.maven }}
      docker: ${{ steps.filter.outputs.docker }}
      helm: ${{ steps.filter.outputs.helm }}
    steps:
    - name: Detect validation paths
      id: filter
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      with:
        filters: |
          maven:
            - 'pom.xml'
            - 'mvnw'
            - '.mvn/**'
            - 'src/**'
            - 'charts/qubership-log-generator/config/**'
          docker:
            - 'Dockerfile'
            - 'pom.xml'
            - 'mvnw'
            - '.mvn/**'
            - 'src/**'
            - 'static/**'
            - 'charts/qubership-log-generator/config/**'
            - '.github/workflows/build.yaml'
          helm:
            - 'charts/**'
            - '.github/workflows/build.yaml'

  maven:
    name: Maven package and smoke
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.maven != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Java
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
      with:
        distribution: temurin
        java-version: '25'
    - name: Package application
      run: |
        chmod +x ./mvnw
        ./mvnw -B -ntp package
    - name: Smoke the packaged jar
      run: |
        set -euo pipefail
        export LOG_TEMPLATES=java
        export LOG_GENERATION_TIME=1
        export LOG_MESSAGES_PER_SECOND=1
        export LOG_CONFIG_FILES_PATH="${GITHUB_WORKSPACE}/charts/qubership-log-generator/config/"
        java -jar target/qubership-log-generator.jar &
        pid=$!
        trap 'kill "$pid" 2>/dev/null || true' EXIT
        for _ in $(seq 1 30); do
          if curl -fsS http://127.0.0.1:8080/metrics >/dev/null; then
            curl -fsS http://127.0.0.1:8080/metrics | grep -q .
            exit 0
          fi
          sleep 1
        done
        echo "application did not serve /metrics on :8080"
        exit 1

  helm:
    name: Helm lint and template
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.helm != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
    - name: Lint chart
      run: helm lint charts/qubership-log-generator
    - name: Render chart
      run: helm template qubership-log-generator charts/qubership-log-generator

  multiplatform_build:
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.docker != 'false'
    strategy:
      fail-fast: false
      matrix:
        component:
        - name: qubership-log-generator
          file: Dockerfile
          context: .
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: ${{ matrix.component.name }}
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
      with:
        images: |
          ghcr.io/${{ github.repository_owner }}/${{ matrix.component.name }}
        tags: |
          type=ref,event=branch
          type=ref,event=tag
    - name: Set up QEMU
      uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
    - name: Build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
        no-cache: true
        context: ${{ matrix.component.context }}
        file: ${{ matrix.component.file }}
        platforms: linux/amd64,linux/arm64
        push: false
        provenance: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  multiplatform_publish:
    if: >-
      github.event_name != 'pull_request' &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]'
    strategy:
      fail-fast: false
      matrix:
        component:
        - name: qubership-log-generator
          file: Dockerfile
          context: .
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: Publish ${{ matrix.component.name }}
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
      with:
        images: |
          ghcr.io/${{ github.repository_owner }}/${{ matrix.component.name }}
        tags: |
          type=ref,event=branch
          type=ref,event=tag
    - name: Set up QEMU
      uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
    - name: Login to GHCR
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
        no-cache: true
        context: ${{ matrix.component.context }}
        file: ${{ matrix.component.file }}
        platforms: linux/amd64,linux/arm64
        push: true
        provenance: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  maven-ci-gate:
    name: Maven CI Gate
    needs: [changes, maven]
    if: ${{ always() && github.event_name == 'pull_request' }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Require Maven validation when applicable
      if: >-
        needs.changes.result != 'success' ||
        (needs.changes.outputs.maven != 'false' && needs.maven.result != 'success')
      run: exit 1

  docker-gate:
    name: Docker Gate
    needs: [changes, multiplatform_build]
    if: ${{ always() && github.event_name == 'pull_request' }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Require Docker validation when applicable
      if: >-
        needs.changes.result != 'success' ||
        (needs.changes.outputs.docker != 'false' && needs.multiplatform_build.result != 'success')
      run: exit 1

  helm-gate:
    name: Helm Gate
    needs: [changes, helm]
    if: ${{ always() && github.event_name == 'pull_request' }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions: {}
    steps:
    - name: Require Helm validation when applicable
      if: >-
        needs.changes.result != 'success' ||
        (needs.changes.outputs.helm != 'false' && needs.helm.result != 'success')
      run: exit 1
